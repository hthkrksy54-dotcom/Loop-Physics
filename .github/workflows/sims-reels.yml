name: Loop Physics Reels nachholen

# By hand: post every recent Loop Physics video whose Instagram Reel failed (e.g. while Instagram was not
# reachable), oldest first. Shares the Loop Physics queue so it never races a posting run.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sims
  cancel-in-progress: false

jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Catch up the Reels
        env:
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
        run: python -m ytauto sims --reels

      - name: Save progress
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "Loop Physics Reels [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 10))
            done
          fi
