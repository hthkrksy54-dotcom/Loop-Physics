name: Loop Physics timer

# GitHub drops or delays many scheduled runs, but runs started via workflow_dispatch start right away.
# Each Loop Physics run starts this timer; it waits until the next slot and starts the next run.
on:
  workflow_dispatch:
    inputs:
      at:
        description: "Start the next Loop Physics run at (UTC, ISO time)"
        required: true

permissions:
  actions: write

concurrency:
  group: sims-timer
  cancel-in-progress: true  # only the newest plan counts

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AT: ${{ github.event.inputs.at }}
        run: |
          WAIT=$(( $(date -d "$AT" +%s) - $(date +%s) ))
          if [ "$WAIT" -gt 19800 ]; then WAIT=19800; fi
          if [ "$WAIT" -gt 0 ]; then echo "waiting $WAIT s until $AT"; sleep "$WAIT"; fi
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/sims.yml/dispatches" \
            -d '{"ref":"main","inputs":{"source":"timer"}}'
          echo "started the next Loop Physics run"
