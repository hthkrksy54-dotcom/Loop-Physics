name: Real Numbers Reels

# Once a day, 00:40 UTC (20:40 US Eastern summer time): post the Short of the oldest episode that has no
# Instagram Reel yet (made before Instagram was connected, or its Reel failed). Nothing to do = nothing posted.
on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: econ
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Catch up one Reel
        env:
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
        run: python -m ytauto econ reel

      - name: Save progress
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "Real Numbers Reel [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 10))
            done
          fi
