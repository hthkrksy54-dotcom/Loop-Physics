name: Produce videos

on:
  # Paused since 27 Oct 2026 (Quiet Thoughts "active": false in config/channels.json). To resume: set it to
  # true and restore the schedule below.
  # schedule:
  #   # 3:03 UTC (4:03 German time in winter, 5:03 in summer). Quiet Thoughts makes a video every second day
  #   # ("every_days" in config/channels.json): on the other days the run stops after a minute
  #   # (watchdog.daily_slot); the Loop Physics watchdog starts it later if GitHub drops it
  #   - cron: "3 3 * * *"
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages (space separated)"
        default: "de en"
      topic:
        description: "Topic id (empty = next in backlog)"
        default: ""
      upload:
        description: "Publish (YouTube, or GitHub release if YouTube isn't connected)"
        type: boolean
        default: true
      record:
        description: "Mark the topic as done (untick for test runs)"
        type: boolean
        default: true
      source:
        description: "Who started the run (watchdog = catching up a dropped schedule)"
        default: "manual"

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Produce and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_DE: ${{ secrets.YT_REFRESH_TOKEN_DE }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          IN_LANGS: ${{ github.event.inputs.langs || 'de en' }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
          IN_RECORD: ${{ github.event.inputs.record }}
          IN_SOURCE: ${{ github.event.inputs.source }}
        run: |
          ARGS=(--langs $IN_LANGS)
          if [ -n "$IN_TOPIC" ]; then ARGS+=(--topic "$IN_TOPIC"); fi
          if [ "$IN_UPLOAD" = "false" ]; then ARGS+=(--no-upload); fi
          if [ "$IN_RECORD" = "false" ]; then ARGS+=(--no-record); fi
          python -m ytauto run "${ARGS[@]}"

      - name: Save progress (state + generated scripts)
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state content
          if ! git diff --cached --quiet; then
            git commit -m "Record produced videos [skip ci]"
            for i in 1 2 3 4 5; do  # other workflows push too; retry instead of losing the state
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 10))
            done
          fi

      - name: Keep rendered files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            out/**/*.mp4
            out/**/*.jpg
            out/**/*.srt
          retention-days: 7
          if-no-files-found: ignore
