name: Produce videos

on:
  schedule:
    # Mon, Wed, Fri at 14:47 UTC (16:47 German summer time, 10:47 US Eastern)
    - cron: "47 14 * * 1,3,5"
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages (space separated)"
        default: "de en"
      topic:
        description: "Topic id (empty = next in backlog)"
        default: ""
      upload:
        description: "Publish (YouTube, or GitHub release if YouTube isn't connected)"
        type: boolean
        default: true

permissions:
  contents: write
  models: read

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Produce and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_DE: ${{ secrets.YT_REFRESH_TOKEN_DE }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          IN_LANGS: ${{ github.event.inputs.langs || 'de en' }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
        run: |
          ARGS=(--langs $IN_LANGS)
          if [ -n "$IN_TOPIC" ]; then ARGS+=(--topic "$IN_TOPIC"); fi
          if [ "$IN_UPLOAD" = "false" ]; then ARGS+=(--no-upload); fi
          python -m ytauto run "${ARGS[@]}"

      - name: Save progress (state + generated scripts)
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state content
          if ! git diff --cached --quiet; then
            git commit -m "Record produced videos [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Keep rendered files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            out/**/*.mp4
            out/**/*.jpg
            out/**/*.srt
          retention-days: 7
          if-no-files-found: ignore
