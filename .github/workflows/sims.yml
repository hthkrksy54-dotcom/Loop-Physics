name: Loop Physics

# Four simulations a day (SLOTS in ytauto/simchannel.py): new concepts (built twice a day by the concept
# designer, docs/concept-designer.md) go first, in between the concepts that performed best come back in a fresh
# variant. The timer chain starts this workflow for every slot; runs outside a slot only polish manual YouTube
# uploads, top up the TikTok drafts and start overdue workflows. Own queue, so the long Quiet Thoughts renders
# never delay or cancel these runs.
on:
  schedule:
    - cron: "41 */2 * * *"     # posting slots (GitHub sometimes drops scheduled runs – the timer chain and the
    - cron: "13 */2 * * *"     # backup inside the slot window cover that; a slot is only ever posted once)
  workflow_dispatch:
    inputs:
      upload:
        description: "Publish (untick to only render)"
        type: boolean
        default: true
      branding:
        description: "Only update the YouTube channel branding (banner, description)"
        type: boolean
        default: false
      youtube:
        description: "Only polish manual YouTube uploads (check = dry run, describe = newest 4 get the current description)"
        type: choice
        options: ["none", "check", "apply", "describe"]
        default: "none"
      source:
        description: "Who started the run (timer = planned slot)"
        default: "manual"

permissions:
  contents: write
  actions: write  # to start the timer and overdue workflows

concurrency:  # admin-only runs (branding, YouTube polish) never wait behind or replace video runs
  group: ${{ (github.event.inputs.branding == 'true' || github.event.inputs.youtube == 'check' || github.event.inputs.youtube == 'apply' || github.event.inputs.youtube == 'describe') && 'sims-admin' || 'sims' }}
  cancel-in-progress: false

jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # the latest state, also when this run waited in the queue

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Post now or just keep things tidy?
        id: mode
        env:
          IN_BRANDING: ${{ github.event.inputs.branding }}
          IN_YOUTUBE: ${{ github.event.inputs.youtube }}
          IN_SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ "$IN_BRANDING" = "true" ] || [ "$IN_YOUTUBE" = "check" ] || [ "$IN_YOUTUBE" = "apply" ] || [ "$IN_YOUTUBE" = "describe" ]; then MODE=admin
          else MODE=$(python -m ytauto sims --due); fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "mode: $MODE"

      - name: Install ffmpeg
        if: steps.mode.outputs.mode == 'post'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Render and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
          IN_BRANDING: ${{ github.event.inputs.branding }}
          IN_YOUTUBE: ${{ github.event.inputs.youtube }}
          IN_SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ "$MODE" = "admin" ]; then
            if [ "$IN_BRANDING" = "true" ]; then python -m ytauto sims --branding
            else python -m ytauto sims --youtube "$IN_YOUTUBE"; fi
          elif [ "$MODE" = "post" ]; then
            if [ "$IN_UPLOAD" = "false" ]; then python -m ytauto sims --no-upload; else python -m ytauto sims; fi
          else  # heartbeat: give manual YouTube uploads our texts and playlists, refresh their view counts
            python -m ytauto sims --youtube apply || echo "YouTube polish skipped"
            python -m ytauto tiktok backlog || echo "TikTok drafts skipped"
          fi

      - name: Save progress
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "Loop Physics [skip ci]"
            for i in 1 2 3 4 5; do  # other workflows push too; retry instead of losing the state
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 10))
            done
          fi

      - name: Plan the next run and start overdue workflows
        if: always() && github.event.inputs.branding != 'true' && github.event.inputs.youtube != 'check' && github.event.inputs.youtube != 'apply' && github.event.inputs.youtube != 'describe'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          dispatch() {  # workflow file, JSON inputs
            curl -sS -o /dev/null -w "  $1 -> %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":$2}"
          }
          AT=$(python -c "
          import os, datetime as dt
          from ytauto import simchannel as sc
          now = dt.datetime.now(dt.timezone.utc)
          slot = sc.next_slot(now) + dt.timedelta(minutes=1)
          later = now + dt.timedelta(minutes=120 if os.environ.get('JOB_STATUS') == 'success' else 60)  # heartbeat / retry
          print(min(slot, later).isoformat(timespec='seconds'))")
          echo "next Loop Physics run at $AT"
          dispatch sims-timer.yml "{\"at\":\"$AT\"}"
          python -m ytauto watchdog | while read -r line; do
            wf=$(echo "$line" | python -c "import sys, json; print(json.load(sys.stdin)['workflow'])")
            inputs=$(echo "$line" | python -c "import sys, json; print(json.dumps(json.load(sys.stdin)['inputs']))")
            dispatch "$wf" "$inputs"
          done
