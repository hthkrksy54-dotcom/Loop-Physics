name: Loop Physics

# Every 2 hours a new satisfying physics simulation: render, archive as release, Instagram Reel (+ Story every
# 2nd; YouTube once enabled). Own queue, so the long Quiet Thoughts renders never delay or cancel these runs.
on:
  schedule:
    - cron: "40 */2 * * *"     # main slot
    - cron: "7 1-23/2 * * *"   # backups: GitHub sometimes drops scheduled runs; they only post when the
    - cron: "33 1-23/2 * * *"  # last Reel is older than 100 minutes, i.e. when the main slot was skipped
  workflow_dispatch:
    inputs:
      upload:
        description: "Publish (untick to only render)"
        type: boolean
        default: true
      branding:
        description: "Only update the YouTube channel branding (banner, description)"
        type: boolean
        default: false
      youtube:
        description: "Only polish manual YouTube uploads (check = dry run)"
        type: choice
        options: ["none", "check", "apply"]
        default: "none"
      source:
        description: "Who started the run (timer = planned slot)"
        default: "manual"

permissions:
  contents: write
  actions: write  # to start the timer and overdue workflows

concurrency:  # admin-only runs (branding, YouTube polish) never wait behind or replace video runs
  group: ${{ (github.event.inputs.branding == 'true' || github.event.inputs.youtube == 'check' || github.event.inputs.youtube == 'apply') && 'sims-admin' || 'sims' }}
  cancel-in-progress: false

jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # the latest state, also when this run waited in the queue

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
          IN_BRANDING: ${{ github.event.inputs.branding }}
          IN_YOUTUBE: ${{ github.event.inputs.youtube }}
          IN_SOURCE: ${{ github.event.inputs.source }}
        run: |
          if [ "$IN_BRANDING" = "true" ]; then python -m ytauto sims --branding
          elif [ "$IN_YOUTUBE" = "check" ] || [ "$IN_YOUTUBE" = "apply" ]; then python -m ytauto sims --youtube "$IN_YOUTUBE"
          elif [ "$IN_UPLOAD" = "false" ]; then python -m ytauto sims --no-upload
          else python -m ytauto sims; fi

      - name: Save progress
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "Loop Physics [skip ci]"
            for i in 1 2 3 4 5; do  # other workflows push too; retry instead of losing the state
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 10))
            done
          fi

      - name: Plan the next run and start overdue workflows
        if: always() && github.event.inputs.branding != 'true' && github.event.inputs.youtube != 'check' && github.event.inputs.youtube != 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          dispatch() {  # workflow file, JSON inputs
            curl -sS -o /dev/null -w "  $1 -> %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":$2}"
          }
          AT=$(python -c "
          import json, os, datetime as dt
          v = json.load(open('state/sims.json'))['videos']
          now = dt.datetime.now(dt.timezone.utc)
          last = dt.datetime.fromisoformat(v[-1]['date']) if v else now
          gap = 30 if os.environ.get('JOB_STATUS') == 'success' else 90  # after a failure: no retry storm
          print(max(last + dt.timedelta(minutes=120), now + dt.timedelta(minutes=gap)).isoformat(timespec='seconds'))")
          echo "next Loop Physics run at $AT"
          dispatch sims-timer.yml "{\"at\":\"$AT\"}"
          python -m ytauto watchdog | while read -r line; do
            wf=$(echo "$line" | python -c "import sys, json; print(json.load(sys.stdin)['workflow'])")
            inputs=$(echo "$line" | python -c "import sys, json; print(json.dumps(json.load(sys.stdin)['inputs']))")
            dispatch "$wf" "$inputs"
          done
