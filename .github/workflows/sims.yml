name: Loop Physics

# Every 4 hours a new satisfying physics simulation: render, archive as release, Instagram Reel + Story
# (YouTube once enabled). Own queue, so the long Quiet Thoughts renders never delay or cancel these runs.
on:
  schedule:
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Publish (untick to only render)"
        type: boolean
        default: true
      branding:
        description: "Only update the YouTube channel branding (banner, description)"
        type: boolean
        default: false
      youtube:
        description: "Only polish manual YouTube uploads (check = dry run)"
        type: choice
        options: ["none", "check", "apply"]
        default: "none"

permissions:
  contents: write

concurrency:
  group: sims
  cancel-in-progress: false

jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Render and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
          IN_BRANDING: ${{ github.event.inputs.branding }}
          IN_YOUTUBE: ${{ github.event.inputs.youtube }}
        run: |
          if [ "$IN_BRANDING" = "true" ]; then python -m ytauto sims --branding
          elif [ "$IN_YOUTUBE" = "check" ] || [ "$IN_YOUTUBE" = "apply" ]; then python -m ytauto sims --youtube "$IN_YOUTUBE"
          elif [ "$IN_UPLOAD" = "false" ]; then python -m ytauto sims --no-upload
          else python -m ytauto sims; fi

      - name: Save progress
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "Loop Physics [skip ci]"
            for i in 1 2 3 4 5; do  # other workflows push too; retry instead of losing the state
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 10))
            done
          fi
