name: Sync uploads

# Every four hours (10:23 UTC is the Quiet Thoughts Reel time): notice videos uploaded by hand on YouTube, fix
# their Shorts, post the Instagram Reels, and keep the TikTok inbox of Quiet Thoughts topped up with drafts (at most
# 5 waiting, TikTok's limit). Fewer runs = fewer GitHub Actions minutes.
on:
  schedule:
    - cron: "23 2,6,10,14,18,22 * * *"
  workflow_dispatch:
    inputs:
      tiktok_max:
        description: "TikTok: at most this many drafts waiting per channel (TikTok allows 5 a day)"
        type: choice
        options: ["5", "4", "3"]
        default: "5"

permissions:
  contents: write
  actions: write  # to start overdue workflows

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Sync
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_DE: ${{ secrets.YT_REFRESH_TOKEN_DE }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          YT_REFRESH_TOKEN_ECON: ${{ secrets.YT_REFRESH_TOKEN_ECON }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m ytauto sync

      - name: TikTok drafts (Real Numbers, Quiet Thoughts)
        env:
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          TIKTOK_MAX: ${{ github.event.inputs.tiktok_max || '5' }}
        run: |
          python -m ytauto tiktok backlog --channel econ --max "$TIKTOK_MAX" || echo "Real Numbers: TikTok skipped this hour"
          python -m ytauto tiktok backlog --channel quiet --max "$TIKTOK_MAX" || echo "Quiet Thoughts: TikTok skipped this hour"

      - name: Save progress
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "Sync uploads [skip ci]"
            for i in 1 2 3 4 5; do  # other workflows push too; retry instead of losing the state
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 10))
            done
          fi

      - name: Start overdue workflows
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m ytauto watchdog | while read -r line; do
            wf=$(echo "$line" | python -c "import sys, json; print(json.load(sys.stdin)['workflow'])")
            inputs=$(echo "$line" | python -c "import sys, json; print(json.dumps(json.load(sys.stdin)['inputs']))")
            curl -sS -o /dev/null -w "  $wf -> %{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$wf/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":$inputs}"
          done
