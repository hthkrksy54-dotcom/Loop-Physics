name: Instagram carousel

# Tue/Thu/Sat, between the video days: a quote carousel from a published video + a quote Story.
on:
  schedule:
    - cron: "12 16 * * 2,4,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Post carousel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python -m ytauto carousel

      - name: Save progress
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state content/scripts
          if ! git diff --cached --quiet; then
            git commit -m "Instagram carousel [skip ci]"
            for i in 1 2 3 4 5; do  # other workflows push too; retry instead of losing the state
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep $((i * 10))
            done
          fi
