name: Instagram verbinden

# Stores a new Instagram token for one channel, encrypted with IG_TOKEN_KEY in the channel's token file, without
# the token ever being pasted anywhere else: put it in the secret IG_NEW_TOKEN (Meta app → API setup with
# Instagram login → Generate token), then run this workflow for the channel. The token renews itself from then on.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel"
        type: choice
        options: ["econ", "sims", "quiet"]
        default: "econ"

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Store the token
        env:
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          IG_NEW_TOKEN: ${{ secrets.IG_NEW_TOKEN }}
          CHANNEL: ${{ github.event.inputs.channel }}
        run: |
          set -o pipefail
          if [ -z "$IG_NEW_TOKEN" ]; then echo "::error::Secret IG_NEW_TOKEN is missing"; exit 1; fi
          # Shape only, never the token: Instagram-login tokens start with IGAA and have no spaces or line breaks
          TOKEN=$(printf '%s' "$IG_NEW_TOKEN" | tr -d '[:space:]"')
          echo "token: ${#IG_NEW_TOKEN} characters (${#TOKEN} without spaces/quotes), starts with ${TOKEN:0:4}"
          python -m ytauto instagram-connect --channel "$CHANNEL" --token "$TOKEN" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the token file
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if ! git diff --cached --quiet; then
            git commit -m "Instagram connected (${{ github.event.inputs.channel }}) [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 10))
            done
          fi
