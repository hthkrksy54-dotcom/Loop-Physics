name: Real Numbers

# One long video a day (8–15 min, money & economy explained with data, stop-motion paper) plus a Short over a
# minute: archived as a release, the Short as Instagram Reel + story and TikTok draft, YouTube once enabled.
# Scripts come from the writer (docs/econ-writer.md); the run takes the next one in the queue.
on:
  schedule:
    - cron: "3 2 * * *"   # 4:03 German time in summer (the other run stops itself: watchdog.daily_slot)
    - cron: "3 3 * * *"   # 4:03 German time in winter
  workflow_dispatch:
    inputs:
      script:
        description: "Script id, several separated by spaces (empty = next in the queue)"
        default: ""
      upload:
        description: "Publish (untick to only render)"
        type: boolean
        default: true
      source:
        description: "Who started the run (watchdog = catching up a dropped schedule)"
        default: "manual"
      branding:
        description: "Only set the channel banner on YouTube (no video)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: econ
  cancel-in-progress: false

jobs:
  econ:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Channel banner
        if: github.event.inputs.branding == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_ECON: ${{ secrets.YT_REFRESH_TOKEN_ECON }}
        run: python -m ytauto econ branding

      - name: Due now? (4:00 German time, once a day)
        if: github.event.inputs.branding != 'true'
        id: today
        run: |
          python -c "
          import json, pathlib
          from ytauto import watchdog
          p = pathlib.Path('state/econ.json')
          why = watchdog.daily_slot(json.loads(p.read_text())['videos'] if p.exists() else [])
          print(why or 'due')
          open('$GITHUB_OUTPUT', 'a').write('done=' + ('yes' if why else 'no') + chr(10))"

      - name: Render and publish
        if: github.event.inputs.branding != 'true' && ((github.event_name == 'workflow_dispatch' && github.event.inputs.source != 'watchdog') || steps.today.outputs.done == 'no')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_ECON: ${{ secrets.YT_REFRESH_TOKEN_ECON }}
          IN_SCRIPT: ${{ github.event.inputs.script }}
          IN_UPLOAD: ${{ github.event.inputs.upload }}
        run: |
          if [ "$IN_UPLOAD" = "false" ]; then python -m ytauto econ produce $IN_SCRIPT --no-upload
          else python -m ytauto econ produce $IN_SCRIPT; fi

      - name: Save progress
        if: always()
        run: |
          git config user.name "ytauto-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state content/econ/data
          if ! git diff --cached --quiet; then
            git commit -m "Real Numbers [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((i * 10))
            done
          fi
